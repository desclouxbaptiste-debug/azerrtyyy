<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }} · Clipzo</title>
    <link rel="icon" href="/assets/logo.webp" type="image/webp" />
    <link rel="stylesheet" href="/vendor/inter/inter.css" />
    <style>
      /* Reading page in the site's own night look: one narrow column, articles that are easy to find again */
      @font-face {
        font-family: "Geist Pixel Circle";
        src: url("/fonts/GeistPixel-Circle.woff2") format("woff2");
        font-display: swap;
      }
      :root {
        color-scheme: dark;
        --bg: #050506;
        --surface: #121214;
        --text: #ededef;
        --muted: #9a9aa3;
        --line: rgba(255, 255, 255, 0.11);
        --accent: #ff3b5c;
        --todo-bg: #ffd166;
        --todo-text: #1d1600;
        --font-sans: "Inter", "Segoe UI", system-ui, sans-serif;
        --font-display: "Geist Pixel Circle", ui-monospace, monospace;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 16px/1.65 var(--font-sans);
        -webkit-font-smoothing: antialiased;
      }
      a { color: inherit; text-decoration-color: rgba(255, 59, 92, 0.7); text-underline-offset: 3px; }
      a:hover { color: #fff; text-decoration-color: var(--accent); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }

      .top {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px 24px;
        padding: 14px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));
        background: rgba(5, 5, 6, 0.9);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(12px);
      }
      .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
      .brand .mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #fff; }
      .brand img { width: 72%; height: 72%; object-fit: contain; display: block; }
      .brand span { font-family: var(--font-display); font-size: 20px; letter-spacing: 0.02em; }
      .top nav { display: flex; flex-wrap: wrap; gap: 6px; }
      .top nav a {
        padding: 7px 14px;
        border-radius: 999px;
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        text-decoration: none;
      }
      .top nav a:hover { color: var(--text); background: var(--surface); }
      .top nav a[aria-current="page"] { color: #000; background: var(--text); }

      .doc {
        max-width: 880px;
        margin: 0 auto;
        padding: 48px max(16px, env(safe-area-inset-right, 0px)) 72px max(16px, env(safe-area-inset-left, 0px));
      }
      .doc > * { max-width: 68ch; }
      .doc > .table-wrap { max-width: none; }
      h1, h2, h3 { text-wrap: balance; line-height: 1.2; }
      h1 { margin: 0 0 8px; font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 6vw, 46px); }
      h2 { margin: 48px 0 12px; font-size: 21px; font-weight: 600; scroll-margin-top: 88px; }
      h3 { margin: 28px 0 8px; font-size: 16.5px; font-weight: 600; }
      p, ul, ol { margin: 0 0 14px; }
      ul, ol { padding-left: 22px; }
      li { margin-bottom: 6px; }
      strong { font-weight: 600; color: #fff; }
      .updated { color: var(--muted); font-size: 14px; margin-bottom: 28px; }
      .lead { font-size: 17.5px; color: var(--text); }
      .muted { color: var(--muted); }
      .eyebrow {
        margin: 0 0 4px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .toc {
        margin: 0 0 8px;
        padding: 18px 22px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
      }
      .toc ol { margin: 0; padding-left: 20px; columns: 2 220px; column-gap: 32px; }
      .toc li { margin-bottom: 4px; font-size: 14.5px; break-inside: avoid; }

      .card {
        margin: 18px 0;
        padding: 18px 22px;
        border-radius: 16px;
        background: var(--surface);
        border: 1px solid var(--line);
      }
      .card > :last-child { margin-bottom: 0; }
      .card.key { border-color: rgba(255, 59, 92, 0.45); }

      .table-wrap { max-width: 100%; overflow-x: auto; margin: 16px 0 20px; border: 1px solid var(--line); border-radius: 14px; }
      table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 14.5px; line-height: 1.5; }
      th, td { padding: 11px 14px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
      th { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
      tr:last-child td { border-bottom: 0; }
      td:first-child { width: 24%; font-weight: 500; color: #fff; }
      .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

      dl.ids { display: grid; grid-template-columns: minmax(130px, max-content) 1fr; gap: 6px 18px; margin: 0 0 14px; }
      dl.ids dt { color: var(--muted); }
      dl.ids dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

      mark.todo {
        padding: 1px 6px;
        border-radius: 6px;
        background: var(--todo-bg);
        color: var(--todo-text);
        font-weight: 600;
        font-size: 0.92em;
      }
      .notice {
        margin: 0 0 28px;
        padding: 14px 18px;
        border-radius: 14px;
        background: rgba(255, 209, 102, 0.12);
        border: 1px solid rgba(255, 209, 102, 0.45);
        font-size: 14.5px;
      }

      .form-model {
        margin: 16px 0;
        padding: 20px 22px;
        border-radius: 16px;
        border: 1px dashed rgba(255, 255, 255, 0.28);
        background: var(--surface);
        font-size: 15px;
      }
      .form-model p { margin-bottom: 10px; }
      .form-model .blank { display: inline-block; min-width: 12ch; border-bottom: 1px dotted var(--muted); }
      .copy {
        margin-top: 6px;
        padding: 9px 18px;
        border: 0;
        border-radius: 999px;
        background: var(--text);
        color: #000;
        font: 600 14px var(--font-sans);
        cursor: pointer;
      }
      .copy:hover { background: #fff; }

      .foot {
        border-top: 1px solid var(--line);
        padding: 22px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
        color: var(--muted);
        font-size: 14px;
        text-align: center;
      }
      @media (max-width: 520px) {
        .doc { padding-top: 32px; }
        dl.ids { grid-template-columns: 1fr; gap: 0; }
        dl.ids dd { margin-bottom: 10px; }
      }
      @media (prefers-reduced-motion: no-preference) {
        html { scroll-behavior: smooth; }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="/"><span class="mark"><img src="/assets/logo.webp" alt="" width="26" height="26" /></span><span>Clipzo</span></a>
      <nav aria-label="Informations légales">{{ nav }}</nav>
    </header>
    <main class="doc">
      {{#if complete}}{{else}}<p class="notice"><strong>Page incomplète :</strong> les informations surlignées
      doivent encore être renseignées par l'éditeur du site.</p>{{/if}}
      {{ content }}
    </main>
    <footer class="foot"><a href="/">Retour à Clipzo</a> · Textes en vigueur au {{ terms_date }}</footer>
    <script>
      // "Copier le formulaire": the model withdrawal form as plain text
      document.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-copy]");
        if (!btn) return;
        const box = document.getElementById(btn.dataset.copy);
        const text = box.innerText.trim();
        const done = () => { btn.textContent = "Copié"; setTimeout(() => (btn.textContent = "Copier le formulaire"), 2000); };
        (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
          .then(done)
          .catch(() => {
            const range = document.createRange();
            range.selectNodeContents(box);
            const sel = getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
          });
      });
    </script>
  </body>
</html>

services:
  clipzo:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # local only; put a reverse proxy (HTTPS) in front to go public
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLIPZO_WHISPER_MODEL=${CLIPZO_WHISPER_MODEL:-small}
      - CLIPZO_WORKERS=${CLIPZO_WORKERS:-1}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - TWITCH_CLIENT_ID=${TWITCH_CLIENT_ID:-}
      - TWITCH_CLIENT_SECRET=${TWITCH_CLIENT_SECRET:-}
      - CLIPZO_ADMIN_CMD=docker compose exec clipzo python -m server.admin
    volumes:
      - clipzo-data:/data
      - whisper-models:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  clipzo-data:
  whisper-models:
